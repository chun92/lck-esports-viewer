<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LCK Viewer — Faker</title>
<style>
  :root {
    --bg-base: #0A0F1C;
    --bg-surface: #151B2C;
    --border: #2A3142;
    --text-primary: #F5F7FA;
    --text-muted: #A0A7B4;
    --accent-sky: #4FA8E0;
    --accent-gold: #C89B3C;
    --success: #10B981;
    --danger: #EF4444;

    --radius: 10px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --space-12: 48px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-12) var(--space-8);
  }

  /* ───── HEADER ───── */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-8);
    padding-bottom: var(--space-8);
    border-bottom: 1px solid var(--border);
    margin-bottom: var(--space-12);
  }
  .header-left { min-width: 0; }
  .player-id {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
  }
  .player-native {
    color: var(--text-muted);
    font-size: 20px;
    margin-top: var(--space-2);
    font-weight: 500;
  }
  .meta-row {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: var(--space-6);
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-3);
    align-items: center;
  }
  .meta-row .sep {
    color: var(--border);
  }

  .header-right {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    align-items: flex-end;
  }
  .badge-group {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    border: 1px solid transparent;
  }
  .badge-team {
    background: rgba(200, 155, 60, 0.12);
    color: var(--accent-gold);
    border-color: rgba(200, 155, 60, 0.35);
  }
  .badge-role {
    background: rgba(79, 168, 224, 0.12);
    color: var(--accent-sky);
    border-color: rgba(79, 168, 224, 0.35);
  }
  .badge-retired {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.35);
  }

  /* ───── STATS ───── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-4);
    margin-bottom: var(--space-12);
  }
  .stat-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--space-6);
  }
  .stat-label {
    color: var(--text-muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: var(--space-3);
    font-weight: 600;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent-gold);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stat-value.plain {
    color: var(--text-primary);
  }
  .stat-sub {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: var(--space-2);
    font-variant-numeric: tabular-nums;
  }

  /* ───── TIMELINE ───── */
  .timeline-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 var(--space-6) 0;
  }
  .timeline {
    position: relative;
    padding-left: var(--space-8);
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--border);
  }
  .tl-item {
    position: relative;
    padding: var(--space-4) var(--space-6);
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: var(--space-3);
    display: grid;
    grid-template-columns: 200px 1fr auto;
    gap: var(--space-4);
    align-items: center;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    left: calc(var(--space-8) * -1 + 2px);
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--bg-base);
  }
  .tl-item.current {
    border-color: var(--accent-sky);
    background: linear-gradient(180deg, rgba(79,168,224,0.06), rgba(79,168,224,0.02));
  }
  .tl-item.current::before {
    background: var(--accent-gold);
    box-shadow: 0 0 0 3px rgba(200,155,60,0.22), 0 0 12px rgba(200,155,60,0.55);
  }

  .tl-period {
    color: var(--text-muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .tl-item.current .tl-period {
    color: var(--accent-sky);
    font-weight: 600;
  }
  .tl-team {
    font-weight: 700;
    color: var(--text-primary);
    font-size: 15px;
  }
  .tl-meta {
    display: flex;
    gap: var(--space-3);
    align-items: center;
    justify-content: flex-end;
  }
  .pill {
    display: inline-flex;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(79, 168, 224, 0.1);
    color: var(--accent-sky);
    border: 1px solid rgba(79, 168, 224, 0.25);
    line-height: 1.4;
  }
  .tl-days {
    color: var(--text-muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: right;
  }

  @media (max-width: 900px) {
    .stats { grid-template-columns: 1fr; }
    .header { flex-direction: column; }
    .header-right { align-items: flex-start; }
    .badge-group { justify-content: flex-start; }
    .tl-item { grid-template-columns: 1fr; }
    .tl-meta { justify-content: flex-start; }
  }
</style>
</head>
<body>
  <main class="container" id="app"></main>

<script>
  // em dash placeholder + ??? for missing start date
  const EMPTY = '—';
  const MISSING_DATE = '???';

  const player = {
    Player: {
      ID: 'Faker',
      Player: 'Faker',
      Name: 'Lee Sang-hyeok',
      NativeName: '이상혁',
      Country: 'South Korea',
      Age: '29',
      Birthdate: '1996-05-07',
      Team: 'T1',
      Team2: '',
      CurrentTeams: '',
      Role: 'Mid',
      TeamLast: 'T1',
      RoleLast: 'Mid;Part-Owner',
      IsRetired: '0',
      Birthdate__precision: '1',
    },
    History: [
      { StartDate: '2013-02-12', EndDate: '2013-11-12', Team: 'SK Telecom T1 2', Position: 'Mid', Duration: '273', ApproximateDuration: 273, IsCurrent: '0' },
      { StartDate: '2013-11-12', EndDate: '2014-12-02', Team: 'SK Telecom T1 K', Position: 'Mid', Duration: '385', ApproximateDuration: 385, IsCurrent: '0' },
      { StartDate: '2014-12-02', EndDate: '2019-12-08', Team: 'SK Telecom T1', Position: 'Mid', Duration: '1832', ApproximateDuration: 1832, IsCurrent: '0' },
      { StartDate: '2019-12-08', EndDate: '2020-02-17', Team: 'T1', Position: 'Mid', Duration: '71', ApproximateDuration: 71, IsCurrent: '0' },
      { StartDate: '2020-02-17', EndDate: '2023-07-05', Team: 'T1', Position: 'Mid/Part-Owner', Duration: '1234', ApproximateDuration: 1234, IsCurrent: '0' },
      { StartDate: '2023-07-05', EndDate: '2023-08-01', Team: 'T1', Position: 'Mid/Part-Owner', Duration: '27', ApproximateDuration: 27, IsCurrent: '0' },
      { StartDate: '2023-08-01', EndDate: '', Team: 'T1', Position: 'Mid/Part-Owner', Duration: '', ApproximateDuration: 993, IsCurrent: '1' },
    ],
  };

  const fallback = (v) => (v === null || v === undefined || v === '' ? EMPTY : v);

  const splitRoles = (raw) => {
    if (!raw) return [];
    return raw.split(/[;/]/).map(s => s.trim()).filter(Boolean);
  };

  const dayDiff = (start, end) => {
    if (!start || !end) return null;
    const a = new Date(start);
    const b = new Date(end);
    if (isNaN(a) || isNaN(b)) return null;
    return Math.round((b - a) / 86400000);
  };

  const resolveDuration = (t) => {
    if (t.Duration) return Number(t.Duration);
    const diff = dayDiff(t.StartDate, t.EndDate);
    if (diff !== null) return diff;
    if (t.ApproximateDuration) return Number(t.ApproximateDuration);
    return null;
  };

  const formatPeriod = (t, isLast) => {
    const start = t.StartDate || MISSING_DATE;
    const end = t.EndDate || (isLast ? 'present' : MISSING_DATE);
    return `${start} ~ ${end}`;
  };

  const yearsMonths = (days) => {
    const years = Math.floor(days / 365.25);
    const months = Math.floor((days - years * 365.25) / 30.44);
    if (years === 0) return `${months}개월`;
    if (months === 0) return `${years}년`;
    return `${years}년 ${months}개월`;
  };

  // ────────── DERIVED ──────────
  const history = [...player.History].sort((a, b) => {
    const ka = a.StartDate || '';
    const kb = b.StartDate || '';
    return ka.localeCompare(kb);
  });

  const lastIdx = history.length - 1;

  const totalDays = history.reduce((acc, t) => {
    const d = resolveDuration(t);
    return d ? acc + d : acc;
  }, 0);

  const uniqueTeams = new Set(history.map(t => t.Team).filter(Boolean));

  const longest = history.reduce((best, t) => {
    const d = resolveDuration(t) ?? 0;
    return d > (best.days ?? 0) ? { team: t.Team, days: d } : best;
  }, { team: null, days: 0 });

  const isRetired = player.Player.IsRetired === '1';

  // ────────── RENDER ──────────
  const roles = splitRoles(player.Player.RoleLast || player.Player.Role);

  const app = document.getElementById('app');
  app.innerHTML = `
    <section class="header">
      <div class="header-left">
        <h1 class="player-id">${fallback(player.Player.ID)}</h1>
        <div class="player-native">${fallback(player.Player.NativeName)} · ${fallback(player.Player.Name)}</div>
        <div class="meta-row">
          <span>🇰🇷 ${fallback(player.Player.Country)}</span>
          <span class="sep">·</span>
          <span>Age ${fallback(player.Player.Age)}</span>
          <span class="sep">·</span>
          <span>${fallback(player.Player.Birthdate)}</span>
        </div>
      </div>
      <div class="header-right">
        <div class="badge-group">
          ${player.Player.Team ? `<span class="badge badge-team">${player.Player.Team}</span>` : ''}
          ${roles.map(r => `<span class="badge badge-role">${r}</span>`).join('')}
          ${isRetired ? `<span class="badge badge-retired">Retired</span>` : ''}
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-label">프로 경력</div>
        <div class="stat-value">${yearsMonths(totalDays)}</div>
        <div class="stat-sub">총 ${totalDays.toLocaleString()}일</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">거쳐간 팀</div>
        <div class="stat-value plain">${uniqueTeams.size}팀</div>
        <div class="stat-sub">이름 변경 포함</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">최장기 팀</div>
        <div class="stat-value plain" style="font-size:22px;">${fallback(longest.team)}</div>
        <div class="stat-sub" style="color: var(--accent-gold);">${longest.days.toLocaleString()}일</div>
      </div>
    </section>

    <section>
      <h2 class="timeline-title">Career Timeline</h2>
      <div class="timeline">
        ${history.map((t, i) => {
          const isLast = i === lastIdx;
          const isCurrent = t.IsCurrent === '1' || (isLast && !t.EndDate);
          const dur = resolveDuration(t);
          return `
            <div class="tl-item ${isCurrent ? 'current' : ''}">
              <div class="tl-period">${formatPeriod(t, isLast)}</div>
              <div class="tl-team">${fallback(t.Team)}</div>
              <div class="tl-meta">
                <span class="pill">${fallback(t.Position)}</span>
                <span class="tl-days">${dur !== null ? dur.toLocaleString() + ' days' : EMPTY}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
</script>
</body>
</html>
